services:
  neo4j:
    image: neo4j:5-community
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      # Neo4j 5 rejects NEO4J_AUTH=neo4j/neo4j (default password) and requires >= 8 chars.
      NEO4J_AUTH: neo4j/itree.123456
      NEO4J_PLUGINS: '["apoc"]'
    volumes:
      - neo4j-data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12

  memgraph:
    image: memgraph/memgraph:2.20.0
    ports:
      - "7688:7687"
    command: ["--log-level=INFO"]
    volumes:
      - memgraph-data:/var/lib/memgraph
    healthcheck:
      test: ["CMD-SHELL", "echo 'RETURN 1;' | mgconsole --host 127.0.0.1 --port 7687 >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12

volumes:
  neo4j-data: {}
  memgraph-data: {}
